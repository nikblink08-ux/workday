<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#172b45">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Рабочий день">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <title>Рабочий день</title>
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="icon-192.png">
    <style>
        :root {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172b45;
            background: #f3f5f8
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0
        }

        button,
        input,
        textarea,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        header {
            background: #172b45;
            color: white;
            padding: calc(env(safe-area-inset-top) + 18px) 18px 18px
        }

        header small {
            opacity: .7
        }

        header h1 {
            font-size: 25px;
            margin: 4px 0 0
        }

        .wrap {
            max-width: 750px;
            margin: auto;
            padding: 16px 14px 110px
        }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 15px;
            margin: 0 0 12px;
            box-shadow: 0 2px 9px #15253b0a
        }

        .muted {
            color: #758194;
            font-size: 13px
        }

        .title {
            font-size: 19px;
            font-weight: 700;
            margin: 0 0 12px
        }

        .item {
            border: 1px solid #e6eaf0;
            border-radius: 12px;
            padding: 12px;
            margin: 9px 0
        }

        .item strong {
            display: block;
            margin: 5px 0
        }

        .row {
            display: flex;
            align-items: center;
            gap: 9px
        }

        .between {
            justify-content: space-between
        }

        .grow {
            flex: 1;
            min-width: 0
        }

        .pill {
            font-size: 12px;
            padding: 4px 9px;
            border-radius: 20px;
            background: #eaf1f8;
            color: #24466a
        }

        .done {
            background: #e5f4eb;
            color: #24764b
        }

        .working {
            background: #fff0d7;
            color: #91601b
        }

        .btn {
            background: #2766b2;
            border: 0;
            color: white;
            padding: 11px 15px;
            border-radius: 11px;
            font-weight: 600
        }

        .btn.secondary {
            background: #e9eff7;
            color: #25496f
        }

        .btn.danger {
            background: #ffeded;
            color: #a12f35
        }

        .btn.small {
            font-size: 13px;
            padding: 7px 10px
        }

        .field {
            width: 100%;
            border: 1px solid #dbe1e9;
            border-radius: 10px;
            padding: 11px;
            background: white;
            color: #172b45;
            margin: 5px 0 12px
        }

        textarea.field {
            min-height: 85px;
            resize: vertical
        }

        label {
            font-size: 13px;
            font-weight: 600
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e1e5ec;
            display: flex;
            padding: 8px 3px calc(env(safe-area-inset-bottom) + 8px);
            z-index: 5
        }

        nav button {
            flex: 1;
            border: 0;
            background: none;
            color: #7a8596;
            font-size: 11px;
            padding: 5px 0
        }

        nav button.active {
            color: #2162b4;
            font-weight: 700
        }

        nav span {
            display: block;
            font-size: 22px;
            margin-bottom: 3px
        }

        .photos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0
        }

        .photos img {
            width: 82px;
            height: 82px;
            object-fit: cover;
            border-radius: 9px
        }

        .photo {
            position: relative
        }

        .photo button {
            position: absolute;
            right: -4px;
            top: -5px;
            background: #172b45;
            color: white;
            border: 0;
            border-radius: 50%;
            width: 22px;
            height: 22px
        }

        .hidden {
            display: none !important
        }

        .empty {
            text-align: center;
            color: #7b8593;
            padding: 35px 8px
        }

        .sub {
            margin: 8px 0 14px
        }

        .modal {
            position: fixed;
            inset: 0;
            background: #0007;
            z-index: 10;
            display: flex;
            align-items: flex-end;
            justify-content: center
        }

        .sheet {
            background: #fff;
            width: 100%;
            max-width: 750px;
            max-height: 92dvh;
            overflow: auto;
            border-radius: 22px 22px 0 0;
            padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px)
        }

        .sheet h2 {
            margin: 0 0 15px
        }

        .sheet .close {
            float: right;
            border: 0;
            background: #edf1f6;
            border-radius: 9px;
            padding: 7px 12px
        }

        .space {
            height: 8px
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .toolbar>* {
            flex: 1
        }

        .log {
            border-left: 3px solid #d5e1f0;
            padding: 0 0 10px 12px;
            margin: 12px 0
        }

        .log p {
            white-space: pre-wrap;
            margin: 5px 0
        }

        .tap {
            cursor: pointer
        }

        .count {
            font-size: 13px;
            color: #6b7c90
        }

        input[type=file] {
            max-width: 100%
        }

        #notice {
            position: fixed;
            bottom: 90px;
            left: 12px;
            right: 12px;
            margin: auto;
            max-width: 500px;
            background: #172b45;
            color: white;
            padding: 12px;
            border-radius: 12px;
            z-index: 20;
            display: none
        }
    
:root{--ink:#183344;--muted:#385568;--raised:linear-gradient(145deg,#d0e1e8,#b2c9d5 40%,#91adbf);--shadow:inset 2px 3px 3px #e6f4fa,inset -3px -5px 7px #58788c55,5px 8px 12px #294b6066,-3px -3px 8px #d1e6ed55;--dark:linear-gradient(145deg,#47677d,#253f55);--teal:linear-gradient(145deg,#a6d9d8,#63aeb3 45%,#387f8d);--tealshadow:inset 2px 3px 4px #e0ffffbb,inset -3px -5px 6px #215a6a66,3px 6px 9px #294b6077;color:var(--ink);background:#91adba}
body{min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#b9cdd6,#819daa 85%);background-attachment:fixed;overflow-wrap:anywhere}header{background:transparent;padding:calc(env(safe-area-inset-top) + 22px) 20px 8px;max-width:1000px;margin:auto}header small{color:#29495d;opacity:1;font-weight:700;letter-spacing:1px}header h1{color:#f2f8fb;text-shadow:1px 3px 4px #34536699;font-size:30px}.wrap{max-width:1000px;padding:18px 16px 120px}.panel,.item,.log,.stat{background:var(--raised);box-shadow:var(--shadow);border:0;border-radius:22px;padding:16px;margin-bottom:20px}.item{margin:0 0 16px}.muted,.count,.empty{color:var(--muted)}.title{margin-bottom:10px}.btn,.sheet .close{background:var(--teal);box-shadow:var(--tealshadow);color:#173d48;border:0;border-radius:16px;padding:13px 15px;font-weight:750;min-height:44px}.btn.secondary,.sheet .close{background:var(--raised);box-shadow:var(--shadow);color:var(--ink)}.btn.danger{background:linear-gradient(145deg,#f3d7d4,#d6a4a8);color:#762c37;box-shadow:inset 2px 3px 3px #fff4f0,inset -3px -4px 5px #9d5c6866,3px 5px 8px #294b6055}.btn.small{min-height:38px}.item .btn.secondary{background:var(--teal);box-shadow:var(--tealshadow)}button{transition:transform .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent}button:active{transform:translateY(3px) scale(.98);box-shadow:inset 3px 4px 7px #294b6077,inset -2px -2px 4px #e3f5fa55!important}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #185c70;outline-offset:3px}.field{background:#b4cad5;border:0;box-shadow:inset 3px 3px 6px #64839699,inset -2px -2px 4px #e0edf3;color:var(--ink);border-radius:13px;min-width:0;font-size:16px}.field::placeholder{color:#496475}.pill{background:var(--raised);box-shadow:inset 1px 2px 2px #e6f4fa,2px 3px 5px #294b6044;color:#24466a}.pill.done{background:linear-gradient(145deg,#b9dfcb,#7ab7a1);color:#174c3b}.pill.working{background:linear-gradient(145deg,#f2dfb9,#d4b481);color:#63471e}nav{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));background:var(--dark);border:0;border-radius:24px;padding:9px 5px;box-shadow:inset 2px 3px 4px #a0bdcc66,inset -3px -5px 7px #152d42aa,5px 8px 12px #29485d88;gap:4px}nav button{color:#d0e1ec;border-radius:14px;min-width:0;font-size:10px;padding:8px 2px}nav button.active{background:linear-gradient(145deg,#c4e0e6,#7daab8);color:#173e50;box-shadow:inset 1px 2px 3px #e9ffff,2px 4px 6px #142d42}nav svg{display:block;margin:auto;filter:drop-shadow(1px 3px 2px #183b5266)}.sheet{background:linear-gradient(145deg,#c5d8e1,#9eb9c8);box-shadow:var(--shadow);border-radius:28px 28px 0 0}.modal{background:#142e4588}.sheet .close{margin:0 0 10px 10px}.sheet h2{padding-top:8px}.sheet hr{border:0;border-top:1px solid #7899aa;margin:24px 0}.sheet form>.btn{margin-bottom:8px}.sheet input[type=checkbox]{appearance:none;width:24px;height:24px;flex:0 0 24px;border-radius:8px;background:#9bb6c4;box-shadow:inset 2px 3px 5px #476c8099,0 1px 1px #e6f4fa;display:inline-grid;place-content:center;cursor:pointer}.sheet input[type=checkbox]:checked{background:var(--teal);box-shadow:var(--tealshadow)}.sheet input[type=checkbox]:checked:after{content:'✓';font-weight:900;color:#173d48}.log{border-left:0;margin:12px 0;padding:13px}.progress-track{height:13px;background:#7997a9;box-shadow:inset 2px 3px 5px #36586c88,0 1px 1px #e5f3fa;border-radius:20px;overflow:hidden}.progress-fill,#checklistBar{height:100%;border-radius:20px;background:linear-gradient(#a8e3e0,#58aeb4 55%,#327e8c)!important;box-shadow:inset 0 2px 2px #d0ffff,1px 2px 3px #284f60;transition:width .25s}.progress-fill.complete,#checklistBar.complete{background:linear-gradient(#bce7cf,#65b58d,#387d62)!important}.hero{background:var(--dark);color:#edf6fa;box-shadow:inset 2px 3px 4px #a0bdcc66,inset -3px -5px 7px #152d42aa,5px 8px 12px #29485d88;display:flex;align-items:center;gap:15px}.hero .muted{color:#d0e1ec}.hero-icon,.medal{background:var(--teal);box-shadow:var(--tealshadow);border-radius:15px;display:grid;place-items:center;width:42px;height:42px;flex-shrink:0}.hero-icon{width:58px;height:58px}.hero-icon svg,.medal svg{filter:drop-shadow(1px 3px 2px #183b5266)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{margin:0;min-height:118px;padding:14px}.stat:first-child{background:var(--teal);box-shadow:var(--tealshadow)}.stat:last-child{background:linear-gradient(145deg,#c1c5e0,#929bbd)}.stat strong{display:block;font-size:27px;margin-top:3px}.stat small{display:block;margin-top:10px;font-weight:650}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px}.actions .btn{font-size:13px;padding:12px 6px}.calendar-cell{background:var(--raised);box-shadow:var(--shadow);border:0;border-radius:12px;min-height:53px;color:var(--ink);min-width:0;padding:5px 1px}.calendar-cell.selected{background:var(--teal);box-shadow:var(--tealshadow)}.calendar-cell .muted{font-size:10px}.task-list{display:grid;gap:0}.photo img{box-shadow:var(--shadow)}#notice{background:var(--dark);box-shadow:var(--shadow)}@media(min-width:850px){body{padding-left:220px}nav{top:20px;bottom:20px;left:16px;right:auto;width:188px;flex-direction:column;justify-content:flex-start;padding:18px 10px;gap:12px}nav button{flex:0 0 auto;display:flex;align-items:center;gap:12px;text-align:left;padding:15px;font-size:14px}nav span{margin:0}nav svg{margin:0}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.task-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.modal{align-items:center}.sheet{border-radius:28px}#notice{left:240px;bottom:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
    <header><small>ЛИЧНЫЙ РАБОЧИЙ ЕЖЕДНЕВНИК</small>
        <h1 id="heading">Сегодня</h1>
    </header>
    <main id="app" class="wrap"></main>
    <nav id="nav"></nav>
    <div id="modal" class="modal hidden">
        <div class="sheet"><button class="close" onclick="closeModal()">Закрыть ✕</button>
            <div id="modalContent"></div>
        </div>
    </div>
    <div id="notice"></div>
    <script>
        'use strict'; let db, tab = 'today', selectedDate = localDate(), editId = null, photoDraft = []; const tabs = [['today', '☀', 'Сегодня'], ['calendar', '▦', 'Календарь'], ['projects', '▣', 'Проекты'], ['journal', '≡', 'Журнал'], ['settings', '⚙', 'Настройки']]; let tasks = [], projects = [], logs = [], photos = []; function localDate(d = new Date()) { return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-') } function uid() { return crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random() } function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) } function fmt(s) { if (!s) return 'Без даты'; const [y, m, d] = s.split('-'); return `${d}.${m}.${y}` } function projectName(id) { return projects.find(x => x.id === id)?.name || 'Без проекта' } function statusName(s) { return { todo: 'Запланировано', working: 'В работе', done: 'Выполнено' }[s] || 'Запланировано' } function notify(s) { let e = document.getElementById('notice'); e.textContent = s; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 3000) }
        function openDB() { return new Promise((res, rej) => { let r = indexedDB.open('workday-local-v1', 1); r.onupgradeneeded = () => { for (let n of ['tasks', 'projects', 'logs', 'photos']) r.result.createObjectStore(n, { keyPath: 'id' }) }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) }) } function getAll(n) { return new Promise((res, rej) => { let r = db.transaction(n).objectStore(n).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) }) } function put(n, v) { return new Promise((res, rej) => { let r = db.transaction(n, 'readwrite').objectStore(n).put(v); r.onsuccess = () => res(); r.onerror = () => rej(r.error) }) } function del(n, id) { return new Promise((res, rej) => { let r = db.transaction(n, 'readwrite').objectStore(n).delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error) }) } async function refresh() { [tasks, projects, logs, photos] = await Promise.all(['tasks', 'projects', 'logs', 'photos'].map(getAll)); render() }
        function clayIcon(n,size=25){const paths={today:'<path d="m3 11 9-8 9 8M6 10v10h5v-6h3v6h4V10"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6M17 2v6M3 11h18M8 15h2M14 15h2"/>',projects:'<path d="M3 6h7l3 3h8v10H3z"/>',journal:'<path d="M12 5v15M3 4q5-2 9 1 4-3 9-1v15q-5-2-9 1-4-3-9-1z"/>',settings:'<path d="m9 3 6 0 1 3 3 1 2 5-2 2v4l-5 3-2-2-4 1-4-4 1-3-2-3 3-5 3 1z"/><circle cx="12" cy="12" r="3"/>',list:'<rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4V2h6v2M9 10h6M9 15h6"/>',check:'<path d="m6 12 4 4 8-9"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'};return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||paths.list}</svg>`} function render() { document.getElementById('heading').textContent = tabs.find(t => t[0] === tab)[2]; document.getElementById('nav').innerHTML = tabs.map(t => `<button class="${tab === t[0] ? 'active' : ''}" onclick="${t[0]==='today'?"selectedDate=localDate();":""}go('${t[0]}')"><span>${clayIcon(t[0])}</span>${t[2]}</button>`).join(''); let app = document.getElementById('app'); if (tab === 'today') app.innerHTML = dayView(selectedDate); if (tab === 'calendar') app.innerHTML = calendarView(); if (tab === 'projects') app.innerHTML = projectsView(); if (tab === 'journal') app.innerHTML = journalView(); if (tab === 'settings') app.innerHTML = settingsView() } function go(t) { tab = t; render(); window.scrollTo(0, 0) } function taskCard(t) { return `<div class="item"><div class="row between"><span class="pill ${t.status === 'done' ? 'done' : t.status === 'working' ? 'working' : ''}">${statusName(t.status)}</span><span class="muted">${t.created ? fmt(localDate(new Date(t.created))) : ""}</span></div><strong class="tap" onclick="taskModal('${t.id}')">${esc(t.title)}</strong><div class="muted">${esc(projectName(t.projectId))}</div>
${t.deadline ? `<p style="font-size:13px;color:${t.status !== 'done' && t.deadline < localDate() ? '#a12f35' : '#758194'}">Срок выполнения: ${fmt(t.deadline)}${t.status !== 'done' && t.deadline < localDate() ? ' · Просрочена' : ''}</p>` : ''}${t.note ? `<p>${esc(t.note)}</p>` : ''}

${(t.checklist || []).length ? `
    <div style="margin:12px 0">
        <div class="row between muted" style="margin-bottom:5px">
            <span>Критерии готовности: ${t.checklist.filter(c => c.done).length} из ${t.checklist.length}</span>
            <span>${Math.round(t.checklist.filter(c => c.done).length / t.checklist.length * 100)}%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill ${t.checklist.every(c=>c.done)?'complete':''}" style="width:${t.checklist.filter(c => c.done).length / t.checklist.length * 100}%"></div>
        </div>
    </div>
` : ''}<div class="row between sub"><span class="count">📷 ${photos.filter(p => p.ownerType === 'task' && p.ownerId === t.id).length} · 💬 ${logs.filter(l => l.taskId === t.id).length}</span><button class="btn secondary small" onclick="taskModal('${t.id}')">Открыть</button></div></div>` } function completionDay(t){return t.completedAt ? localDate(new Date(t.completedAt)) : ''}
function taskGroups(date){const active=tasks.filter(t=>t.status!=='done'); const sort=(a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'); return [active.filter(t=>t.deadline&&t.deadline<date).sort(sort),active.filter(t=>t.deadline===date),active.filter(t=>!t.deadline||t.deadline>date).sort(sort),tasks.filter(t=>t.status==='done'&&completionDay(t)===date)];}
function dayView(date) { const today=localDate(); const groups=taskGroups(today); const section=(name,a)=>a.length?`<div class="title">${name}</div><div class="task-list">${a.map(taskCard).join('')}</div>`:''; return `<div class="panel"><div class="title" style="margin:0">Сегодня · ${fmt(today)}</div></div><div class="actions"><button class="btn" onclick="taskModal()">＋ Добавить задачу</button><button class="btn secondary" onclick="logModal(null,'${today}')">＋ Запись в журнал</button></div>${groups.map((a,i)=>section(['Просроченные задачи','Срок выполнения сегодня','Текущие задачи','Выполнено сегодня'][i],a)).join('')||'<div class="panel empty">Нет текущих задач</div>'}` }
function calendarView() { let d = new Date(selectedDate + 'T12:00:00'), y = d.getFullYear(), m = d.getMonth(), first = new Date(y, m, 1), last = new Date(y, m + 1, 0).getDate(), start = (first.getDay() + 6) % 7; let cells = ''; for (let i = 0; i < start; i++)cells += '<div></div>'; for (let n = 1; n <= last; n++) { let date = localDate(new Date(y, m, n, 12)), ct = tasks.filter(t => t.deadline === date).length; cells += `<button onclick="selectedDate='${date}';render()" class="calendar-cell ${date === selectedDate ? 'selected' : ''}">${n}<div class="muted">${ct ? ct + ' задач' : ''}</div></button>` } return `<div class="panel"><div class="row between"><button class="btn secondary small" onclick="moveMonth(-1)">‹</button><strong>${new Intl.DateTimeFormat('ru', { month: 'long', year: 'numeric' }).format(d)}</strong><button class="btn secondary small" onclick="moveMonth(1)">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:18px 0 8px;text-align:center" class="muted">${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(x => `<div>${x}</div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${cells}</div></div><div class="panel muted">Сроки выполнения · ${fmt(selectedDate)}</div><div class="task-list">${tasks.filter(t=>t.deadline===selectedDate).map(taskCard).join('')||'<div class="panel empty">На эту дату сроков нет</div>'}</div><div class="panel"><div class="title">Завершённые задачи</div>${tasks.filter(t=>t.status==='done').map(taskCard).join('')||'<div class="muted">Нет завершённых задач</div>'}</div>` } function moveMonth(n) { let d = new Date(selectedDate + 'T12:00:00'); d.setDate(1); d.setMonth(d.getMonth() + n); selectedDate = localDate(d); render() } function projectsView() { return `<div class="panel"><div class="row between"><div class="title">Все проекты</div><button class="btn" onclick="projectModal()">＋ Проект</button></div><input class="field" placeholder="Поиск по проектам и задачам" oninput="filterProjects(this.value)" id="projectSearch"></div><div id="projectList">${projects.map(p => projectCard(p)).join('') || '<div class="panel empty">Создай первый проект</div>'}</div>` } function projectCard(p) { let a = tasks.filter(t => t.projectId === p.id); return `<div class="panel tap" onclick="projectModal('${p.id}')"><div class="row between"><strong>${esc(p.name)}</strong><span class="pill ${p.archived ? 'done' : ''}">${p.archived ? 'Архив' : 'Активен'}</span></div><p class="muted">${a.length} задач · ${a.filter(t => t.status === 'done').length} выполнено · 📷 ${photos.filter(x => x.ownerType === 'project' && x.ownerId === p.id).length}</p>${p.deadline ? `<p style="font-size:13px;color:${!p.archived && p.deadline < localDate() ? '#a12f35' : '#758194'}">Срок выполнения: ${fmt(p.deadline)}${!p.archived && p.deadline < localDate() ? ' · Просрочен' : ''}</p>` : '<p class="muted">Срок не установлен</p>'}${p.description ? `<div>${esc(p.description)}</div>` : ''}</div>` } function filterProjects(q) { q = q.toLowerCase(); document.getElementById('projectList').innerHTML = projects.filter(p => p.name.toLowerCase().includes(q) || tasks.some(t => t.projectId === p.id && t.title.toLowerCase().includes(q))).map(projectCard).join('') || '<div class="panel empty">Ничего не найдено</div>' } function logCard(l) { return `<div class="log"><div class="row between"><span class="muted">${fmt(l.date)} · ${esc(projectName(l.projectId))}${l.taskId ? ' · ' + esc(tasks.find(t => t.id === l.taskId)?.title || 'Задача') : ''}</span><button class="btn secondary small" onclick="logModal('${l.id}')">Изменить</button></div><p>${esc(l.text)}</p></div>` } function journalView() { return `<div class="panel"><div class="row between"><div class="title">История работы</div><button class="btn" onclick="logModal()">＋ Запись</button></div><input class="field" placeholder="Поиск по комментариям" oninput="filterLogs(this.value)" /></div><div class="panel" id="logList">${logs.slice().sort((a, b) => b.date.localeCompare(a.date) || b.created.localeCompare(a.created)).map(logCard).join('') || '<div class="empty">Записей пока нет</div>'}</div>` } function filterLogs(q) { document.getElementById('logList').innerHTML = logs.filter(l => l.text.toLowerCase().includes(q.toLowerCase())).sort((a, b) => b.date.localeCompare(a.date)).map(logCard).join('') || '<div class="empty">Ничего не найдено</div>' } function settingsView() { return `<div class="panel"><div class="title">Локальное хранение</div><p>Записи и фотографии сохраняются только в хранилище этого приложения на устройстве. Сервер и учётная запись не используются.</p><p class="muted">Удаление данных сайта или приложения может привести к потере записей. Регулярно сохраняй резервную копию отдельно.</p><button class="btn" onclick="backup()">⬇ Экспорт резервной копии</button><div class="space"></div><label>Восстановить из файла JSON</label><input class="field" type="file" accept="application/json,.json" onchange="restore(this.files[0]);this.value=''" /></div><div class="panel"><div class="title">О приложении</div><p>Рабочий день · версия 1.2.1 (тест)</p><p class="muted">Без аналитики, регистрации и отправки данных в сеть. Для установки и офлайн-режима требуется HTTPS.</p></div>` }
        function showModal(html) { document.getElementById('modalContent').innerHTML = html;

    const checklist = document.getElementById('taskChecklist');

    if (checklist) {
        
        checklist.addEventListener("input", updateChecklistProgress);
        checklist.addEventListener("change", updateChecklistProgress);
        checklist.addEventListener("click", updateChecklistProgress);
        updateChecklistProgress();
    } document.getElementById('modal').classList.remove('hidden') } function closeModal() { document.getElementById('modal').classList.add('hidden'); photoDraft = [] } function optionsProject(sel) { return `<option value="">Без проекта</option>` + projects.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('') } function photosHtml(type, id) { let a = photos.filter(p => p.ownerType === type && p.ownerId === id); return `<div class="photos">${a.map(p => `<div class="photo"><img src="${p.data}" onclick="window.open(this.src,'_blank')"><button onclick="removePhoto('${p.id}')">×</button></div>`).join('')}</div><label>Добавить фотографии</label><input class="field" type="file" accept="image/*" multiple onchange="addPhotos(this.files,'${type}','${id}')">` } function taskModal(id) { let t = tasks.find(x => x.id === id) || { id: '', title: '', date: selectedDate, projectId: '', status: 'todo', note: '' }; showModal(`<h2>${id ? 'Задача' : 'Новая задача'}</h2><form onsubmit="saveTask(event,'${id || ''}')"><label>Название</label><input class="field" name="title" required maxlength="200" value="${esc(t.title)}"><p class="muted">Дата создания: ${id ? (t.created ? fmt(localDate(new Date(t.created))) : 'Неизвестна') : 'Будет установлена автоматически'}</p><label>Крайний срок выполнения</label>
<input class="field" type="date" name="deadline" value="${esc(t.deadline || '')}"><label>Проект</label><select class="field" name="projectId">${optionsProject(t.projectId)}</select><label>Статус</label><select class="field" name="status">${['todo', 'working', 'done'].map(s => `<option value="${s}" ${s === t.status ? 'selected' : ''}>${statusName(s)}</option>`).join('')}</select><label>Описание и результат</label><textarea class="field" name="note">${esc(t.note)}</textarea>

<h3>Критерии готовности</h3>

<div class="row between muted" style="margin-bottom:5px">
    <span id="checklistCount">0 из 0</span>
    <span id="checklistPercent">0%</span>
</div>

<div class="progress-track" style="margin-bottom:12px">
    <div id="checklistBar" style="height:100%;width:0%;background:#2766b2;border-radius:10px"></div>
</div>

<div id="taskChecklist">
    ${(t.checklist || []).map(c => `
        <div class="row" style="margin-bottom:8px">
            <input type="checkbox" class="criterionDone" ${c.done ? 'checked' : ''}>
            <input class="field grow criterionText" style="margin:0" value="${esc(c.text)}" placeholder="Критерий готовности">
            <button type="button" class="btn danger small" onclick="this.parentElement.remove(); updateChecklistProgress()">×</button>
        </div>
    `).join('')}
</div>

<button type="button" class="btn secondary" onclick="addCriterion()">＋ Добавить критерий</button>

<div class="space"></div><button class="btn" type="submit">Сохранить</button> ${id ? `<button class="btn danger" type="button" onclick="deleteTask('${id}')">Удалить</button>` : ''}</form>${id ? `<hr><h3>Фотографии</h3>${photosHtml('task', id)}<h3>Комментарии и история</h3>${logs.filter(l => l.taskId === id).sort((a, b) => b.created.localeCompare(a.created)).map(logCard).join('')}<button class="btn secondary" onclick="logModal(null,'${localDate()}','${id}')">＋ Комментарий</button>` : '<p class="muted">Сначала сохрани задачу, затем можно будет добавить фотографии и комментарии.</p>'}`) } function updateChecklistProgress() {
    const rows = Array.from(document.querySelectorAll('#taskChecklist .row'))
        .filter(row => row.querySelector('.criterionText').value.trim() !== '');

    const total = rows.length;
    const done = rows.filter(row => row.querySelector('.criterionDone').checked).length;
    const percent = total ? Math.round(done / total * 100) : 0;

    document.getElementById('checklistCount').textContent = done + ' из ' + total;
    document.getElementById('checklistPercent').textContent = percent + '%';

    const bar = document.getElementById('checklistBar');
    bar.style.width = percent + '%';
    bar.classList.toggle('complete', percent === 100);
}

function addCriterion() {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.marginBottom = '8px';
    row.innerHTML = `
        <input type="checkbox" class="criterionDone">
        <input class="field grow criterionText" style="margin:0" placeholder="Критерий готовности">
        <button type="button" class="btn danger small" onclick="this.parentElement.remove(); updateChecklistProgress()">×</button>
    `;
    document.getElementById('taskChecklist').appendChild(row);
    row.querySelector('.criterionText').focus();
    updateChecklistProgress();
}

async function saveTask(e, id) { e.preventDefault(); let f = e.target.elements; let old=tasks.find(x=>x.id===id); let t = { ...old, id: id || uid(), title: f.title.value.trim(), date: old?.date || localDate(), completedAt: f.status.value==='done' ? (old?.status==='done' ? (old.completedAt||'') : new Date().toISOString()) : '', deadline: f.deadline.value, projectId: f.projectId.value, status: f.status.value,
note: f.note.value,
checklist: Array.from(document.querySelectorAll('#taskChecklist .row')).map(row => ({
    text: row.querySelector('.criterionText').value.trim(),
    done: row.querySelector('.criterionDone').checked
})).filter(c => c.text !== ''),
created: tasks.find(x => x.id === id)?.created || new Date().toISOString() }; await put('tasks', t); closeModal(); await refresh(); notify('Задача сохранена') } async function deleteTask(id) { if (!confirm('Удалить задачу и её комментарии и фотографии?')) return; await del('tasks', id); for (let p of photos.filter(p => p.ownerType === 'task' && p.ownerId === id)) await del('photos', p.id); for (let l of logs.filter(l => l.taskId === id)) await del('logs', l.id); closeModal(); await refresh() }
        function projectModal(id) { let p = projects.find(x => x.id === id) || { id: '', name: '', description: '', archived: false }; showModal(`<h2>${id ? 'Проект' : 'Новый проект'}</h2><form onsubmit="saveProject(event,'${id || ''}')"><label>Название проекта</label><input class="field" name="name" required maxlength="200" value="${esc(p.name)}"><label>Срок выполнения</label><input class="field" name="deadline" type="date" value="${esc(p.deadline || '')}"><label>Описание</label><textarea class="field" name="description">${esc(p.description)}</textarea><label class="row"><input type="checkbox" name="archived" ${p.archived ? 'checked' : ''}> Завершён / в архиве</label><div class="space"></div><button class="btn" type="submit">Сохранить</button> ${id ? `<button class="btn danger" type="button" onclick="deleteProject('${id}')">Удалить проект</button>` : ''}</form>${id ? `<hr><h3>Фотографии проекта</h3>${photosHtml('project', id)}<h3>Задачи проекта</h3>${tasks.filter(t => t.projectId === id).sort((a, b) => (b.created||'').localeCompare(a.created||'')).map(taskCard).join('') || '<p class="muted">Задач нет</p>'}<button class="btn secondary" onclick="newProjectTask('${id}')">＋ Задача проекта</button>` : ''}`) } async function saveProject(e, id) { e.preventDefault(); let f = e.target.elements; await put('projects', { id: id || uid(), name: f.name.value.trim(), description: f.description.value, deadline: f.deadline.value, archived: f.archived.checked }); closeModal(); await refresh(); notify('Проект сохранён') } function newProjectTask(id) { taskModal(); document.querySelector('#modalContent [name=projectId]').value = id } async function deleteProject(id) { if (!confirm('Удалить проект? Задачи останутся без проекта, фотографии проекта будут удалены.')) return; for (let t of tasks.filter(t => t.projectId === id)) await put('tasks', { ...t, projectId: '' }); for (let p of photos.filter(p => p.ownerType === 'project' && p.ownerId === id)) await del('photos', p.id); await del('projects', id); closeModal(); await refresh() }
        function logModal(id, date, taskId) { let l = logs.find(x => x.id === id) || { id: '', date: date || localDate(), taskId: taskId || '', projectId: tasks.find(t => t.id === taskId)?.projectId || '', text: '' }; showModal(`<h2>${id ? 'Редактировать запись' : 'Запись в журнал'}</h2><form onsubmit="saveLog(event,'${id || ''}')"><label>Дата</label><input class="field" type="date" name="date" required value="${l.date}"><label>Проект</label><select class="field" name="projectId">${optionsProject(l.projectId)}</select><label>Связать с задачей</label><select class="field" name="taskId"><option value="">Без задачи</option>${tasks.map(t => `<option value="${t.id}" ${t.id === l.taskId ? 'selected' : ''}>${esc(t.title)}</option>`).join('')}</select><label>Что сделано / комментарий</label><textarea class="field" name="text" required>${esc(l.text)}</textarea><button class="btn" type="submit">Сохранить</button> ${id ? `<button type="button" class="btn danger" onclick="deleteLog('${id}')">Удалить</button>` : ''}</form>`) } async function saveLog(e, id) { e.preventDefault(); let f = e.target.elements; await put('logs', { id: id || uid(), date: f.date.value, projectId: f.projectId.value, taskId: f.taskId.value, text: f.text.value, created: logs.find(x => x.id === id)?.created || new Date().toISOString() }); closeModal(); await refresh(); notify('Запись сохранена') } async function deleteLog(id) { if (!confirm('Удалить запись?')) return; await del('logs', id); closeModal(); await refresh() }
        async function addPhotos(files, type, id) { for (let file of Array.from(files)) { if (!file.type.startsWith('image/')) continue; try { let data = await compress(file); await put('photos', { id: uid(), ownerType: type, ownerId: id, data, created: new Date().toISOString() }) } catch (e) { notify('Не удалось добавить фотографию') } } await refresh(); if (type === 'task') taskModal(id); else projectModal(id) } function compress(file) { return new Promise((res, rej) => { let img = new Image(), url = URL.createObjectURL(file); img.onload = () => { let scale = Math.min(1, 1600 / Math.max(img.width, img.height)); let c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .78)) }; img.onerror = () => { URL.revokeObjectURL(url); rej() }; img.src = url }) } async function removePhoto(id) { if (!confirm('Удалить фотографию?')) return; let p = photos.find(x => x.id === id); await del('photos', id); await refresh(); if (p.ownerType === 'task') taskModal(p.ownerId); else projectModal(p.ownerId) }
        async function backup() { let data = { format: 'workday-v1', exported: new Date().toISOString(), tasks, projects, logs, photos }; let blob = new Blob([JSON.stringify(data)], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = 'rabochiy-den-' + localDate() + '.json'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000); notify('Резервная копия подготовлена. Сохрани файл в надёжном месте.') } async function restore(file) { if (!file) return; try { let data = JSON.parse(await file.text()); if (data.format !== 'workday-v1' || !['tasks', 'projects', 'logs', 'photos'].every(k => Array.isArray(data[k]))) throw Error('Неверный формат'); if (!confirm('Импорт объединит данные с текущими записями. Совпадающие ID будут заменены. Продолжить?')) return; for (let n of ['tasks', 'projects', 'logs', 'photos']) for (let item of data[n]) { if (!item || typeof item.id !== 'string') throw Error('Некорректные записи'); await put(n, item) } await refresh(); notify('Резервная копия импортирована') } catch (e) { alert('Ошибка импорта: ' + e.message) } }
        (async () => { try { db = await openDB(); await refresh(); if ('serviceWorker' in navigator && !location.pathname.endsWith('index-clay.html')) navigator.serviceWorker.register('./sw.js').catch(() => { }) } catch (e) { document.getElementById('app').innerHTML = '<div class="panel">Не удалось открыть локальное хранилище. Проверь настройки Safari и отключи приватный режим.</div>' } })();
    </script>
</body>
